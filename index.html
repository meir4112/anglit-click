<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אנגלית בקליק - לומדים אנגלית בכיף</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf5ec;
  --ink:#232838;
  --ink-soft:#5a6172;
  --card:#ffffff;
  --coral:#ff6b4a;
  --teal:#0ea493;
  --amber:#f7b32b;
  --indigo:#5b6cff;
  --rose:#ef5da8;
  --good:#1faa6d;
  --bad:#e2452f;
  --shadow:0 10px 30px rgba(35,40,56,.09);
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Rubik',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(600px 400px at 90% -5%, rgba(247,179,43,.16), transparent 60%),
    radial-gradient(700px 500px at -10% 30%, rgba(14,164,147,.13), transparent 60%),
    radial-gradient(600px 500px at 80% 95%, rgba(91,108,255,.10), transparent 60%);
}
.en{direction:ltr;unicode-bidi:isolate;font-family:'Rubik',sans-serif}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;
  background:rgba(250,245,236,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(35,40,56,.07);
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;cursor:pointer}
.logo-badge{
  width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--coral),var(--amber));
  color:#fff;font-size:1.2rem;box-shadow:0 4px 12px rgba(255,107,74,.4);
}
.stats{display:flex;gap:10px}
.stat-pill{
  display:flex;align-items:center;gap:7px;
  background:var(--card);border-radius:999px;padding:7px 15px;
  font-weight:700;font-size:.95rem;box-shadow:0 3px 10px rgba(35,40,56,.07);
}
.stat-pill .ico{font-size:1.05rem}

/* ---------- hero ---------- */
.wrap{max-width:1060px;margin:0 auto;padding:0 20px 60px}
.hero{padding:44px 0 26px;text-align:center}
.hero h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:900;line-height:1.15;letter-spacing:-.5px}
.hero h1 .hl{
  background:linear-gradient(90deg,var(--coral),var(--rose),var(--indigo));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{color:var(--ink-soft);font-size:1.1rem;margin-top:12px;font-weight:400}
.hero-badges{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.hero-badge{
  background:#fff;border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600;
  color:var(--ink-soft);box-shadow:0 3px 10px rgba(35,40,56,.06);
}

/* ---------- level tabs ---------- */
.level-tabs{display:flex;justify-content:center;gap:10px;margin:26px 0 8px}
.level-tab{
  border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:1rem;
  padding:10px 26px;border-radius:999px;background:#fff;color:var(--ink-soft);
  box-shadow:0 3px 10px rgba(35,40,56,.06);transition:all .2s;
}
.level-tab.active{background:var(--ink);color:#fff;transform:translateY(-1px)}

/* ---------- exercise cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:24px}
.card{
  background:var(--card);border-radius:var(--radius);padding:24px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .18s, box-shadow .18s;
  border-top:5px solid var(--c, var(--coral));
  display:flex;flex-direction:column;gap:10px;
}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(35,40,56,.14)}
.card .c-ico{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.55rem;
  background:color-mix(in srgb, var(--c, var(--coral)) 14%, #fff);
}
.card h3{font-size:1.2rem;font-weight:800}
.card p{color:var(--ink-soft);font-size:.92rem;line-height:1.5;flex:1}
.card .c-progress{height:8px;border-radius:99px;background:#eef0f4;overflow:hidden}
.card .c-progress > div{height:100%;border-radius:99px;background:var(--c,var(--coral));transition:width .4s}
.card .c-meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-soft);font-weight:600}

/* ---------- exercise view ---------- */
#exerciseView{display:none}
.ex-top{display:flex;align-items:center;justify-content:space-between;padding:26px 0 6px;gap:12px;flex-wrap:wrap}
.btn-back{
  border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:.95rem;
  background:#fff;border-radius:999px;padding:9px 18px;box-shadow:0 3px 10px rgba(35,40,56,.08);color:var(--ink);
}
.btn-back:hover{background:var(--ink);color:#fff}
.ex-progress-wrap{flex:1;min-width:140px;height:10px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 4px rgba(35,40,56,.08)}
.ex-progress-wrap>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .35s}
.ex-count{font-weight:700;color:var(--ink-soft);font-size:.9rem;white-space:nowrap}

.stage{
  background:var(--card);border-radius:26px;box-shadow:var(--shadow);
  padding:34px 30px;margin-top:20px;min-height:340px;
  display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;
}
.stage h2{font-size:1.35rem;font-weight:800}
.stage .sub{color:var(--ink-soft);font-size:.95rem;margin-top:-14px}

.btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:1.02rem;
  padding:13px 34px;border-radius:999px;transition:transform .12s, box-shadow .12s, background .2s;
  background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(35,40,56,.22);
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--coral),#ff8f5e)}
.btn.teal{background:linear-gradient(135deg,var(--teal),#2cc4b2)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(35,40,56,.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* dictation */
.play-btn{
  width:96px;height:96px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--indigo),#8b94ff);color:#fff;font-size:2.2rem;
  box-shadow:0 10px 26px rgba(91,108,255,.4);transition:transform .15s;
  display:grid;place-items:center;
}
.play-btn:hover{transform:scale(1.06)}
.play-btn.speaking{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.mini-btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:.85rem;
  background:#f2f4f8;border-radius:999px;padding:8px 16px;color:var(--ink-soft);
}
.mini-btn:hover{background:var(--ink);color:#fff}
.answer-input{
  font-family:inherit;font-size:1.15rem;font-weight:600;text-align:left;direction:ltr;
  width:min(560px,100%);padding:15px 18px;border-radius:16px;
  border:2.5px solid #e3e6ee;outline:none;background:#fbfbfc;transition:border .2s;
}
.answer-input:focus{border-color:var(--indigo);background:#fff}
.diff-line{font-size:1.15rem;font-weight:700;line-height:2;background:#fbfbfc;border-radius:16px;padding:12px 18px;width:min(560px,100%)}
.diff-word{display:inline-block;padding:2px 8px;border-radius:8px;margin:2px}
.diff-ok{background:rgba(31,170,109,.15);color:var(--good)}
.diff-miss{background:rgba(226,69,47,.13);color:var(--bad);text-decoration:line-through}
.diff-exp{background:rgba(31,170,109,.15);color:var(--good)}

/* options (mcq + fill) */
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(620px,100%)}
@media(max-width:560px){.options{grid-template-columns:1fr}}
.opt{
  border:2.5px solid #e8eaf1;background:#fff;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:1.05rem;padding:15px 18px;border-radius:16px;transition:all .15s;
}
.opt:hover{border-color:var(--indigo);transform:translateY(-2px)}
.opt.correct{border-color:var(--good);background:rgba(31,170,109,.12);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(226,69,47,.1);color:var(--bad)}
.opt:disabled{cursor:default}
.blank-sentence{font-size:1.35rem;font-weight:700;line-height:2}
.blank-gap{
  display:inline-block;min-width:110px;border-bottom:3px dashed var(--coral);
  color:var(--coral);font-weight:800;text-align:center;padding:0 8px;
}

/* matching */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(680px,100%);direction:ltr}
.match-col{display:flex;flex-direction:column;gap:10px}
.match-item{
  border:2.5px solid #e8eaf1;background:#fff;cursor:pointer;font-family:inherit;
  font-weight:700;font-size:1.02rem;padding:13px 14px;border-radius:14px;transition:all .15s;
}
.match-item:hover{transform:translateY(-2px)}
.match-item.sel{border-color:var(--amber);background:rgba(247,179,43,.15)}
.match-item.done{border-color:var(--good);background:rgba(31,170,109,.12);color:var(--good);cursor:default;opacity:.75}
.match-item.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ordering */
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:ltr;min-height:52px;width:100%;padding:10px;border-radius:16px;background:#f6f7fa}
.chips.answer-zone{background:rgba(91,108,255,.06);border:2.5px dashed #d3d7ff}
.chip{
  border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:1.05rem;
  padding:10px 18px;border-radius:999px;background:#fff;color:var(--ink);
  box-shadow:0 3px 8px rgba(35,40,56,.1);transition:transform .12s;
}
.chip:hover{transform:translateY(-2px)}
.chip.used{opacity:.25;pointer-events:none}

/* feedback */
.feedback{min-height:34px;font-weight:800;font-size:1.1rem}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

/* results */
.result-emoji{font-size:3.4rem}
.result-pts{font-size:1.05rem;font-weight:700;color:var(--ink-soft)}
.result-pts b{color:var(--coral);font-size:1.3rem}

/* confetti */
.confetti{position:fixed;top:-12px;width:10px;height:16px;z-index:99;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}

.footer-note{text-align:center;color:var(--ink-soft);font-size:.85rem;margin-top:36px}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo" onclick="goHome()">
    <div class="logo-badge">🎧</div>
    <span>אנגלית <span style="color:var(--coral)">בקליק</span></span>
  </div>
  <div class="stats">
    <div class="stat-pill"><span class="ico">⭐</span><span id="statPoints">0</span></div>
    <div class="stat-pill"><span class="ico">🔥</span><span id="statStreak">0</span> ימים</div>
  </div>
</header>

<main class="wrap">

  <!-- HOME -->
  <section id="homeView">
    <div class="hero">
      <h1>לומדים אנגלית <span class="hl">בכיף</span>,<br>תרגיל אחר תרגיל</h1>
      <p>האזנה, כתיבה, משחקי מילים ועוד - בחינם, בקצב שלך, וההתקדמות נשמרת אצלך במחשב.</p>
      <div class="hero-badges">
        <div class="hero-badge">🎧 תרגילי האזנה</div>
        <div class="hero-badge">✍️ השלמת משפטים</div>
        <div class="hero-badge">🧩 משחקי התאמה</div>
        <div class="hero-badge">📈 מעקב התקדמות</div>
      </div>
    </div>

    <div class="level-tabs">
      <button class="level-tab active" id="tabBeg" onclick="setLevel('beg')">🌱 מתחילים</button>
      <button class="level-tab" id="tabAdv" onclick="setLevel('adv')">🚀 מתקדמים</button>
    </div>

    <div class="cards" id="cardsGrid"></div>

    <div class="footer-note">נבנה באהבה 💛 ההתקדמות שלך נשמרת במחשב הזה בלבד - בלי חשבון, בלי תשלום, בלי אינטרנט מסובך.</div>
  </section>

  <!-- EXERCISE -->
  <section id="exerciseView">
    <div class="ex-top">
      <button class="btn-back" onclick="goHome()">→ חזרה לתפריט</button>
      <div class="ex-progress-wrap"><div id="exBar" style="width:0%"></div></div>
      <div class="ex-count" id="exCount"></div>
    </div>
    <div class="stage" id="stage"></div>
  </section>

</main>

<script>
/* ================= CONTENT ================= */
const DATA = {
beg: {
  dictation: [
    "I wake up early every morning",
    "The cat is sleeping on the sofa",
    "We drink tea in the evening",
    "She has two brothers and one sister",
    "They walk to school together",
    "My father works in a big office",
    "I like to read books before bed",
    "The children are playing in the park",
    "Please close the door behind you",
    "We eat dinner at seven o'clock",
    "The sun is hot in the summer",
    "He opens the window in the morning"
  ],
  fill: [
    {s:"I ___ breakfast at eight o'clock", a:"eat", o:["eat","sleep","run","sing"]},
    {s:"The opposite of hot is ___", a:"cold", o:["cold","warm","big","fast"]},
    {s:"A ___ is an animal that says woof", a:"dog", o:["dog","cat","bird","fish"]},
    {s:"We drink water from a ___", a:"cup", o:["cup","plate","chair","book"]},
    {s:"There are seven days in a ___", a:"week", o:["week","month","year","hour"]},
    {s:"My mother's sister is my ___", a:"aunt", o:["aunt","uncle","brother","cousin"]},
    {s:"When it rains, I take an ___", a:"umbrella", o:["umbrella","apple","shoe","key"]},
    {s:"The baby is crying because he is ___", a:"hungry", o:["hungry","tall","blue","loud"]},
    {s:"You write with a pen on a piece of ___", a:"paper", o:["paper","water","bread","glass"]},
    {s:"At night we see the moon and the ___", a:"stars", o:["stars","cars","tables","doors"]},
    {s:"Fish live in the ___", a:"water", o:["water","tree","sky","house"]},
    {s:"Before you cross the road, look left and ___", a:"right", o:["right","up","down","back"]}
  ],
  match: [
    {title:"משפחה", pairs:[["mother","אמא"],["father","אבא"],["brother","אח"],["sister","אחות"],["baby","תינוק"],["family","משפחה"]]},
    {title:"אוכל ושתייה", pairs:[["bread","לחם"],["water","מים"],["milk","חלב"],["apple","תפוח"],["cheese","גבינה"],["egg","ביצה"]]},
    {title:"בבית", pairs:[["door","דלת"],["window","חלון"],["table","שולחן"],["bed","מיטה"],["chair","כיסא"],["lamp","מנורה"]]},
    {title:"זמן וימים", pairs:[["morning","בוקר"],["evening","ערב"],["night","לילה"],["today","היום"],["week","שבוע"],["hour","שעה"]]}
  ],
  mcq: [
    {q:"What does \"book\" mean?", o:["ספר","מחברת","עט","שולחן"], a:0},
    {q:"What does \"happy\" mean?", o:["שמח","עצוב","כועס","עייף"], a:0},
    {q:"What does \"run\" mean?", o:["לרוץ","ללכת","לשבת","לישון"], a:0},
    {q:"What does \"small\" mean?", o:["קטן","גדול","ארוך","רחב"], a:0},
    {q:"What does \"friend\" mean?", o:["חבר","שכן","אויב","אורח"], a:0},
    {q:"What does \"eat\" mean?", o:["לאכול","לשתות","לבשל","לקנות"], a:0},
    {q:"What does \"cold\" mean?", o:["קר","חם","רטוב","יבש"], a:0},
    {q:"What does \"house\" mean?", o:["בית","רחוב","עיר","חדר"], a:0},
    {q:"What does \"speak\" mean?", o:["לדבר","לשיר","לכתוב","לקרוא"], a:0},
    {q:"What does \"new\" mean?", o:["חדש","ישן","מהר","לאט"], a:0}
  ],
  order: [
    "I like to play football",
    "She drinks milk in the morning",
    "We go to the park on Friday",
    "The dog runs in the garden",
    "He reads a book at night",
    "They eat lunch at school",
    "My sister sings very well",
    "I brush my teeth every day"
  ]
},
adv: {
  dictation: [
    "The weather today is much better than yesterday",
    "I have been studying English for three months",
    "Could you tell me where the nearest station is",
    "We are planning to visit our grandparents next week",
    "Practice a little every day and you will improve",
    "The train was late because of the heavy rain",
    "She decided to learn a new language this year",
    "It is important to drink enough water every day"
  ],
  fill: [
    {s:"I have lived here ___ 2019", a:"since", o:["since","for","from","at"]},
    {s:"She is interested ___ learning languages", a:"in", o:["in","on","at","for"]},
    {s:"If it rains tomorrow, we ___ stay home", a:"will", o:["will","would","did","are"]},
    {s:"He has already ___ his homework", a:"finished", o:["finished","finish","finishing","finishes"]},
    {s:"This book is ___ than the other one", a:"better", o:["better","best","good","more good"]},
    {s:"They asked me ___ I wanted some tea", a:"if", o:["if","that","what","which"]},
    {s:"We look forward ___ seeing you soon", a:"to", o:["to","for","at","on"]},
    {s:"The meeting was cancelled ___ of the storm", a:"because", o:["because","due","thanks","instead"]}
  ],
  match: [
    {title:"פעלים חשובים", pairs:[["decide","להחליט"],["improve","להשתפר"],["borrow","לשאול"],["explain","להסביר"],["arrive","להגיע"],["choose","לבחור"]]},
    {title:"תארים", pairs:[["honest","ישר"],["brave","אמיץ"],["patient","סבלני"],["polite","מנומס"],["curious","סקרן"],["generous","נדיב"]]}
  ],
  mcq: [
    {q:"What does \"almost\" mean?", o:["כמעט","אף פעם","תמיד","בדיוק"], a:0},
    {q:"What does \"enough\" mean?", o:["מספיק","יותר מדי","קצת","בכלל לא"], a:0},
    {q:"What does \"borrow\" mean?", o:["לשאול","להשאיל","לקנות","למכור"], a:0},
    {q:"What does \"probably\" mean?", o:["כנראה","בטוח שלא","אף פעם","אתמול"], a:0},
    {q:"What does \"instead\" mean?", o:["במקום","בגלל","למרות","לפני"], a:0},
    {q:"What does \"busy\" mean?", o:["עסוק","פנוי","עייף","מהיר"], a:0}
  ],
  order: [
    "Could you help me with this bag",
    "I forgot to bring my keys today",
    "She has never been to London before",
    "We will meet them at the station",
    "He told me a very funny story",
    "Learning English takes time and patience"
  ]
}};

const EX_META = [
  {key:"dictation", ico:"🎧", c:"#5b6cff", title:"שומעים וכותבים", desc:"מקשיבים למשפט באנגלית וכותבים אותו. בדיוק כמו הכיתובית ההיא שאתה אוהב - רק בלי לשלם."},
  {key:"fill",      ico:"✍️", c:"#ff6b4a", title:"משלימים את המשפט", desc:"חסרה מילה במשפט. בוחרים את המילה הנכונה מארבע אפשרויות."},
  {key:"match",     ico:"🧩", c:"#0ea493", title:"משחק ההתאמות", desc:"מחברים כל מילה באנגלית למשמעות שלה בעברית. נגד השעון? לא - נגד הזיכרון."},
  {key:"mcq",       ico:"🎯", c:"#ef5da8", title:"מה המשמעות?", desc:"שאלות אמריקאיות קצרות על מילים שימושיות. ארבע תשובות, אחת נכונה."},
  {key:"order",     ico:"🔀", c:"#f7b32b", title:"מסדרים את המשפט", desc:"המילים התפזרו! מסדרים אותן מחדש לפי הסדר הנכון באנגלית."}
];

/* ================= STATE ================= */
const LS_KEY = "anglit_click_progress_v1";
let state = loadState();
let level = "beg";
let session = null;

function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && typeof s==="object") return s; }catch(e){}
  return {points:0, streak:0, lastDay:null, done:{}}; // done: level:type -> [indices]
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function doneKey(){ return level+":"+session.type; }
function doneList(){ return state.done[doneKey()] || []; }
function markDone(i){
  const k = doneKey();
  if(!state.done[k]) state.done[k]=[];
  if(!state.done[k].includes(i)) state.done[k].push(i);
}
function addPoints(n){
  state.points += n;
  const today = new Date().toDateString();
  if(state.lastDay !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    state.streak = (state.lastDay === y.toDateString()) ? state.streak+1 : 1;
    state.lastDay = today;
  }
  saveState(); refreshStats();
}
function refreshStats(){
  document.getElementById("statPoints").textContent = state.points;
  document.getElementById("statStreak").textContent = state.streak;
}

/* ================= TTS ================= */
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  const pref = ["en-US","en_US","en-GB","en_GB"];
  for(const p of pref){ const v = voices.find(v=>v.lang && v.lang.replace("_","-").startsWith(p.split("-")[0]) && v.lang.includes(p.split("-")[1])); if(v) return v; }
  return voices.find(v=>v.lang && v.lang.startsWith("en")) || null;
}
function speak(text, rate){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate || 0.92; u.pitch = 1;
  const v = pickVoice(); if(v) u.voice = v;
  speechSynthesis.speak(u);
  return u;
}

/* ================= NAV ================= */
function setLevel(l){
  level = l;
  document.getElementById("tabBeg").classList.toggle("active", l==="beg");
  document.getElementById("tabAdv").classList.toggle("active", l==="adv");
  renderCards();
}
function goHome(){
  speechSynthesis && speechSynthesis.cancel();
  session = null;
  document.getElementById("exerciseView").style.display = "none";
  document.getElementById("homeView").style.display = "block";
  renderCards();
}
function openExercise(type){
  const items = DATA[level][type];
  session = {type, idx:0, order:shuffle(items.map((_,i)=>i)), points:0, answered:0, correct:0};
  document.getElementById("homeView").style.display = "none";
  document.getElementById("exerciseView").style.display = "block";
  nextQuestion();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function updateBar(){
  const total = session.order.length;
  document.getElementById("exBar").style.width = (session.answered/total*100)+"%";
  document.getElementById("exCount").textContent = "שאלה " + Math.min(session.answered+1,total) + " מתוך " + total;
}

/* ================= RENDER CARDS ================= */
function renderCards(){
  const grid = document.getElementById("cardsGrid");
  grid.innerHTML = "";
  EX_META.forEach(m=>{
    const total = DATA[level][m.key].length;
    const done = (state.done[level+":"+m.key]||[]).length;
    const pct = total? Math.round(done/total*100):0;
    const el = document.createElement("div");
    el.className = "card"; el.style.setProperty("--c", m.c);
    el.innerHTML = `
      <div class="c-ico">${m.ico}</div>
      <h3>${m.title}</h3>
      <p>${m.desc}</p>
      <div class="c-progress"><div style="width:${pct}%"></div></div>
      <div class="c-meta"><span>${done} מתוך ${total} הושלמו</span><span>${pct}%</span></div>`;
    el.onclick = ()=>openExercise(m.key);
    grid.appendChild(el);
  });
}

/* ================= QUESTION FLOW ================= */
function nextQuestion(){
  updateBar();
  const stage = document.getElementById("stage");
  if(session.idx >= session.order.length){ return showResult(); }
  const itemIdx = session.order[session.idx];
  stage.classList.remove("pop"); void stage.offsetWidth; stage.classList.add("pop");
  ({
    dictation: renderDictation,
    fill: renderFill,
    match: renderMatch,
    mcq: renderMcq,
    order: renderOrder
  })[session.type](stage, itemIdx);
}

function advance(wasCorrect, pts){
  session.answered++;
  if(wasCorrect){ session.correct++; addPoints(pts); session.points += pts; }
  markDone(session.order[session.idx]);
  saveState();
  setTimeout(()=>{ session.idx++; nextQuestion(); }, wasCorrect ? 1400 : 2600);
}

function showResult(){
  const stage = document.getElementById("stage");
  const total = session.order.length;
  const pct = Math.round(session.correct/total*100);
  let emoji = "💪", msg = "ניסיון יפה! עוד סיבוב וזה ישב.";
  if(pct===100){ emoji="🏆"; msg="מושלם! כל התשובות נכונות!"; }
  else if(pct>=70){ emoji="🎉"; msg="כל הכבוד! אתה מתקדם יפה מאוד."; }
  else if(pct>=40){ emoji="👍"; msg="בכיוון הנכון! תרגול נוסף יעשה פלאים."; }
  stage.innerHTML = `
    <div class="result-emoji">${emoji}</div>
    <h2>סיימת את הסבב!</h2>
    <div class="result-pts">${session.correct} מתוך ${total} נכונות · צברת <b>+${session.points}</b> נקודות</div>
    <div class="feedback good">${msg}</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="btn primary" onclick="openExercise(session.type)">🔁 עוד סיבוב</button>
      <button class="btn ghost" onclick="goHome()">לתפריט הראשי</button>
    </div>`;
  document.getElementById("exBar").style.width = "100%";
  if(pct>=70) confetti();
}

function confetti(){
  const colors = ["#ff6b4a","#0ea493","#f7b32b","#5b6cff","#ef5da8"];
  for(let i=0;i<60;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100+"vw";
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = (1.6+Math.random()*1.6)+"s";
    c.style.animationDelay = (Math.random()*.5)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 3500);
  }
}

/* ================= 1. DICTATION ================= */
function renderDictation(stage, i){
  const sentence = DATA[level].dictation[i];
  stage.innerHTML = `
    <h2>שומעים וכותבים 🎧</h2>
    <div class="sub">לחץ על הרמקול, הקשב למשפט, וכתוב אותו באנגלית. אפשר לשמוע שוב כמה שצריך!</div>
    <button class="play-btn" id="playBtn" title="נגן">🔊</button>
    <div style="display:flex;gap:8px">
      <button class="mini-btn" id="slowBtn">🐢 שמע לאט</button>
      <button class="mini-btn" id="hintBtn">💡 רמז (מילה ראשונה)</button>
    </div>
    <input class="answer-input" id="ans" placeholder="Type what you hear..." autocomplete="off" spellcheck="false">
    <div class="feedback" id="fb"></div>
    <div id="diffArea"></div>
    <button class="btn primary" id="checkBtn">בדוק ✔</button>`;
  const ans = document.getElementById("ans");
  const fb = document.getElementById("fb");
  const play = document.getElementById("playBtn");
  let hintUsed = false;
  const doPlay = r => { play.classList.add("speaking"); const u = speak(sentence, r); if(u) u.onend = ()=>play.classList.remove("speaking"); else play.classList.remove("speaking"); };
  play.onclick = ()=>doPlay(0.92);
  document.getElementById("slowBtn").onclick = ()=>doPlay(0.55);
  document.getElementById("hintBtn").onclick = ()=>{
    hintUsed = true;
    const first = sentence.split(" ")[0];
    ans.value = first + " "; ans.focus();
  };
  setTimeout(()=>doPlay(0.92), 400);
  ans.focus();
  ans.addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("checkBtn").click(); });
  document.getElementById("checkBtn").onclick = ()=>{
    const guess = ans.value;
    if(!guess.trim()){ fb.className="feedback bad"; fb.textContent="כתוב משהו קודם 🙂"; return; }
    const ok = normalize(guess) === normalize(sentence);
    showDiff(guess, sentence, ok);
    fb.className = "feedback " + (ok?"good":"bad");
    fb.textContent = ok ? (hintUsed ? "נכון! (עם רמז) +" + 8 : "מעולה! בול! +10") : "לא מדויק - הנה ההשוואה. שמע שוב ותלמד מההבדל 👇";
    document.getElementById("checkBtn").disabled = true; ans.disabled = true;
    advance(ok, hintUsed?8:10);
  };
}
function normalize(s){
  return s.toLowerCase().replace(/[.,!?;:'"”’\-]/g,"").replace(/\s+/g," ").trim();
}
function showDiff(guess, sentence, ok){
  const area = document.getElementById("diffArea");
  const gW = normalize(guess).split(" ").filter(Boolean);
  const sW = normalize(sentence).split(" ").filter(Boolean);
  const orig = sentence.split(" ").filter(Boolean);
  let html = '<div class="diff-line en">';
  for(let i=0;i<sW.length;i++){
    const g = gW[i];
    if(ok || g === sW[i]) html += `<span class="diff-word diff-ok">${esc(orig[i])}</span>`;
    else if(g) html += `<span class="diff-word diff-miss">${esc(guess.split(" ").filter(Boolean)[i]||"")}</span><span class="diff-word diff-exp">${esc(orig[i])}</span>`;
    else html += `<span class="diff-word diff-exp">${esc(orig[i])}</span>`;
  }
  html += "</div>";
  area.innerHTML = html;
}

/* ================= 2. FILL IN THE BLANK ================= */
function renderFill(stage, i){
  const item = DATA[level].fill[i];
  const parts = item.s.split("___");
  stage.innerHTML = `
    <h2>משלימים את המשפט ✍️</h2>
    <div class="sub">איזו מילה משלימה את המשפט?</div>
    <div class="blank-sentence en">${esc(parts[0])}<span class="blank-gap" id="gap">?</span>${esc(parts[1]||"")}</div>
    <div class="options en" id="opts"></div>
    <div class="feedback" id="fb"></div>`;
  speak(item.s.replace("___","... "), 0.95);
  const opts = document.getElementById("opts");
  shuffle(item.o.slice()).forEach(word=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = word;
    b.onclick = ()=>{
      const ok = word === item.a;
      document.getElementById("gap").textContent = item.a;
      [...opts.children].forEach(x=>{
        x.disabled = true;
        if(x.textContent === item.a) x.classList.add("correct");
        else if(x === b && !ok) x.classList.add("wrong");
      });
      const fb = document.getElementById("fb");
      fb.className = "feedback " + (ok?"good":"bad");
      fb.textContent = ok ? "נכון! +10" : "לא בדיוק... המילה הנכונה: " + item.a;
      speak(item.s.replace("___", item.a), 0.95);
      advance(ok, 10);
    };
    opts.appendChild(b);
  });
}

/* ================= 3. MATCHING ================= */
function renderMatch(stage, i){
  const set = DATA[level].match[i];
  stage.innerHTML = `
    <h2>משחק ההתאמות: ${set.title} 🧩</h2>
    <div class="sub">לחץ על מילה באנגלית ואז על המשמעות שלה בעברית</div>
    <div class="match-grid">
      <div class="match-col" id="colEn"></div>
      <div class="match-col" id="colHe"></div>
    </div>
    <div class="feedback" id="fb"></div>`;
  const fb = document.getElementById("fb");
  let selEn = null, selHe = null, matched = 0, mistakes = 0;
  const ens = shuffle(set.pairs.map((p,idx)=>({t:p[0], idx})));
  const hes = shuffle(set.pairs.map((p,idx)=>({t:p[1], idx})));
  const tryMatch = ()=>{
    if(!selEn || !selHe) return;
    if(selEn.idx === selHe.idx){
      selEn.el.classList.add("done"); selHe.el.classList.add("done");
      selEn.el.classList.remove("sel"); selHe.el.classList.remove("sel");
      matched++;
      fb.className="feedback good"; fb.textContent = "יופי! ✔";
      if(matched === set.pairs.length){
        const pts = Math.max(6, 12 - mistakes*2);
        fb.textContent = "כל הזוגות הותאמו! +" + pts;
        advance(true, pts);
      }
    } else {
      mistakes++;
      selEn.el.classList.add("shake"); selHe.el.classList.add("shake");
      const e1=selEn.el, e2=selHe.el;
      fb.className="feedback bad"; fb.textContent = "לא מתאים, נסה שוב";
      setTimeout(()=>{ e1.classList.remove("shake","sel"); e2.classList.remove("shake","sel"); }, 380);
    }
    selEn = selHe = null;
  };
  ens.forEach(w=>{
    const b = document.createElement("button");
    b.className="match-item"; b.textContent = w.t;
    b.onclick = ()=>{
      if(b.classList.contains("done")) return;
      if(selEn) selEn.el.classList.remove("sel");
      selEn = {idx:w.idx, el:b}; b.classList.add("sel");
      speak(w.t, 1);
      tryMatch();
    };
    document.getElementById("colEn").appendChild(b);
  });
  hes.forEach(w=>{
    const b = document.createElement("button");
    b.className="match-item"; b.style.direction="rtl"; b.textContent = w.t;
    b.onclick = ()=>{
      if(b.classList.contains("done")) return;
      if(selHe) selHe.el.classList.remove("sel");
      selHe = {idx:w.idx, el:b}; b.classList.add("sel");
      tryMatch();
    };
    document.getElementById("colHe").appendChild(b);
  });
}

/* ================= 4. MULTIPLE CHOICE ================= */
function renderMcq(stage, i){
  const item = DATA[level].mcq[i];
  stage.innerHTML = `
    <h2>מה המשמעות? 🎯</h2>
    <div class="sub">בחר את התשובה הנכונה</div>
    <div class="blank-sentence en">${esc(item.q)}</div>
    <div class="options" id="opts"></div>
    <div class="feedback" id="fb"></div>`;
  const m = item.q.match(/"([^"]+)"/); if(m) speak(m[1], 1);
  const opts = document.getElementById("opts");
  const order = shuffle(item.o.map((t,idx)=>({t,idx})));
  order.forEach(o=>{
    const b = document.createElement("button");
    b.className = "opt"; b.style.direction="rtl"; b.textContent = o.t;
    b.onclick = ()=>{
      const ok = o.idx === item.a;
      [...opts.children].forEach(x=>{
        x.disabled = true;
        if(x.textContent === item.o[item.a]) x.classList.add("correct");
        else if(x === b && !ok) x.classList.add("wrong");
      });
      const fb = document.getElementById("fb");
      fb.className = "feedback " + (ok?"good":"bad");
      fb.textContent = ok ? "בדיוק! +10" : "התשובה הנכונה: " + item.o[item.a];
      advance(ok, 10);
    };
    opts.appendChild(b);
  });
}

/* ================= 5. SENTENCE ORDER ================= */
function renderOrder(stage, i){
  const sentence = DATA[level].order[i];
  const words = sentence.split(" ");
  stage.innerHTML = `
    <h2>מסדרים את המשפט 🔀</h2>
    <div class="sub">לחץ על המילים לפי הסדר הנכון באנגלית</div>
    <div class="chips answer-zone" id="zone"></div>
    <div class="chips" id="pool"></div>
    <div class="feedback" id="fb"></div>
    <div style="display:flex;gap:10px">
      <button class="btn teal" id="checkBtn">בדוק ✔</button>
      <button class="mini-btn" id="hearBtn">🔊 שמע משפט</button>
    </div>`;
  const pool = document.getElementById("pool"), zone = document.getElementById("zone");
  const fb = document.getElementById("fb");
  const chosen = [];
  document.getElementById("hearBtn").onclick = ()=>speak(sentence, 0.85);
  shuffle(words.map((w,idx)=>({w,idx}))).forEach(o=>{
    const c = document.createElement("button");
    c.className = "chip"; c.textContent = o.w;
    c.onclick = ()=>{ c.classList.add("used"); chosen.push({w:o.w, el:c}); renderZone(); };
    pool.appendChild(c);
  });
  function renderZone(){
    zone.innerHTML = "";
    chosen.forEach((c,i)=>{
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = c.w;
      b.onclick = ()=>{ c.el.classList.remove("used"); chosen.splice(i,1); renderZone(); };
      zone.appendChild(b);
    });
  }
  document.getElementById("checkBtn").onclick = ()=>{
    const built = chosen.map(c=>c.w).join(" ");
    if(chosen.length < words.length){ fb.className="feedback bad"; fb.textContent="עוד לא השתמשת בכל המילים 🙂"; return; }
    const ok = normalize(built) === normalize(sentence);
    fb.className = "feedback " + (ok?"good":"bad");
    fb.textContent = ok ? "מושלם! +12" : "הסדר הנכון: " + sentence;
    document.getElementById("checkBtn").disabled = true;
    speak(sentence, 0.9);
    advance(ok, 12);
  };
}

/* ================= INIT ================= */
refreshStats();
renderCards();
if(location.hash){ const t = location.hash.slice(1); if(EX_META.some(m=>m.key===t)) openExercise(t); }
</script>
